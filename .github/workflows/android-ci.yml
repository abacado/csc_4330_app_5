name: 🛠 Android CI / Build & Release APK

on:
  push:
    branches: [ main, master, upgrade ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, upgrade ]
  workflow_dispatch:   # "Run workflow" button on the Actions tab

permissions:
  contents: write   # allow creating/updating Releases & uploading assets
  actions:  read    # allow pulling marketplace actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 🖥️ Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 📥 Get dependencies
        run: dart pub get

      - name: 🧹 Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔍 Analyze
        run: dart analyze --fatal-infos

      - name: ✅ Run server tests
        run: dart test

      - name: 🔁 Smoke test (real server survives a restart)
        run: bash tool/smoke_test.sh

  build_and_release:
    name: 📱 Build APK
    needs: server
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze
        run: flutter analyze --no-fatal-infos

      - name: ✅ Run tests
        run: flutter test --coverage

      # Set a repository variable named API_BASE_URL (Settings → Secrets and
      # variables → Actions → Variables) to bake a server address into the
      # APK. Without it the app uses its defaults (see lib/data/api_config.dart).
      - name: 🏗️ Build APKs
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/

      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: artifacts/*.apk

      - name: 🚢 Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
